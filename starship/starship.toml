# Starship prompt — https://starship.rs/config/
# Preset gallery: https://starship.rs/presets/
add_newline = true
palette = "nord"

format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold frost_cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = "\uf418 "  # branch icon (octicon, x-height sized)
style = "bold red"
truncation_length = 7
truncation_symbol = ""
format = "[on](snow_dim) [$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

[python]
style = "yellow"
format = "[via](snow_dim) [$symbol$version]($style) "

[nodejs]
style = "green"
format = "[via](snow_dim) [$symbol$version]($style) "

[rust]
style = "orange"
format = "[via](snow_dim) [$symbol$version]($style) "

[golang]
style = "frost_teal"
format = "[via](snow_dim) [$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "purple"
format = "[took](snow_dim) [$duration]($style) "

[character]
success_symbol = "[\uf04b](bold red)"  # play icon
error_symbol = "[\uf04b](bold red)"
vimcmd_symbol = "[\uf04a](bold green)"  # reverse icon (vi command mode)

# Nord — https://www.nordtheme.com/docs/colors-and-palettes
[palettes.nord]
polar0 = "#2E3440"      # nord0
polar1 = "#3B4252"      # nord1
polar2 = "#434C5E"      # nord2
polar3 = "#4C566A"      # nord3
snow_dim = "#616E88"    # muted text (between polar3 and snow)
snow = "#D8DEE9"        # nord4
snow_bright = "#ECEFF4" # nord6
frost_teal = "#8FBCBB"  # nord7
frost_cyan = "#88C0D0"  # nord8
frost_blue = "#81A1C1"  # nord9
frost_deep = "#5E81AC"  # nord10
red = "#BF616A"         # nord11
orange = "#D08770"      # nord12
yellow = "#EBCB8B"      # nord13
green = "#A3BE8C"       # nord14
purple = "#B48EAD"      # nord15
